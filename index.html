<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = (s) => document.querySelector(s);
const rand = n => Math.floor(Math.random() * n);
const pick = a => a[rand(a.length)];
function shuf(a){ a.slice(); for (let i = a.length; i > 0; i--){ const j = rand(i); [a[i-1], a[j]] = [a[j], a[i-1]]; } return a; }
const getEl = s => document.querySelector(s);
const hide = s => { const e = getEl(s); if (e) e.style.display = 'none'; };
const show = s => { const e = getEl(s); if (e) e.style.display = ''; };
const setText = (s, t) => { const e = getEl(s); if (e) e.textContent = t; };
function mk(q, opts, ans, expl){ return { q, opts, ans, expl, a: null, n: 0, r: null, c: 0, b: 0 }; }

const LS = 'banquise_v2';
let saveObj = {};
function load(){ try { const d = JSON.parse(localStorage.getItem(LS)); if (d) saveObj = d; } catch (e) { saveObj = {}; } }
function save(){ try { localStorage.setItem(LS, JSON.stringify(saveObj)); } catch (e) {} }
load();

let actx = null;
function actxInit(){ if (!actx){ try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } }
function bloop(freq = 420, dur = 0.08, type = 'square', vol = 0.18){
  actxInit(); if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = freq; g.gain.value = vol;
  o.connect(g); g.connect(actx.destination); o.start();
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
  o.stop(actx.currentTime + dur);
}
const sfxOK = () => { bloop(520, 0.09, 'square', 0.2); setTimeout(() => bloop(660, 0.08, 'square', 0.18), 60); };
const sfxNo = () => bloop(220, 0.14, 'sawtooth', 0.16);
const sfxClick = () => bloop(600, 0.04, 'square', 0.1);
const sfxLevel = () => { bloop(440, 0.1, 'triangle', 0.18); setTimeout(() => bloop(550, 0.1, 'triangle', 0.16), 80); setTimeout(() => bloop(660, 0.12, 'triangle', 0.14), 160); };
async function speak(text, pitch = 1, rate = 1, voice){
  if (!window.speechSynthesis) return;
  const t = (text || '').replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim();
  if (!t) return;
  const synth = window.speechSynthesis;
  const voices = synth.getVoices();
  let vq = voices.find(v => v.lang && v.lang.startsWith('fr'));
  if (voice === 'nightsquirrel' && voices.find(v => v.name && v.name.toLowerCase().includes('zira'))) vq = voices.find(v => v.name && v.name.toLowerCase().includes('zira'));
  if (voice === 'monica' && voices.find(v => v.name && v.name.toLowerCase().includes('samantha'))) vq = voices.find(v => v.name && v.name.toLowerCase().includes('samantha'));
  const smc = new SpeechSynthesisUtterance(t);
  smc.pitch = pitch; smc.rate = rate; smc.volume = 1;
  if (vq) smc.voice = vq;
  smc.lang = 'fr-FR';
  await new Promise(res => { smc.onend = smc.onerror = res; synth.speak(smc); });
}

const NIVEAUX = ['CP', 'CE1', 'CE2'];
const THEMES = ['nombres', 'mesures', 'grammaire', 'conjugaison', 'sciences', 'anglais', 'logique'];
let niveau = 'CE2';
let theme = 'nombres';
let themeIdx = 0;
let NonStop = false;
let duoMode = false;
let duoTurn = 0;
let duoScores = [0, 0];

const G = {};

function mkFromPool(q, correct, pool, expl){
  const opts = [correct];
  const seen = new Set([String(correct)]);
  let guard = 0;
  while (opts.length < 4 && guard < 120){
    const c = pick(pool);
    if (!seen.has(String(c))){ seen.add(String(c)); opts.push(c); }
    guard++;
  }

function numOpts(correct, step, min){
  step = step || 1;
  min = min == null ? 0 : min;
  const out = [correct];
  const cands = [correct + step, correct - step, correct + 2*step, correct + 3*step, correct - 2*step, correct + 4*step];
  for (let i = 0; i < cands.length && out.length < 4; i++){
    const v = Math.round(cands[i]);
    if (v >= min && out.indexOf(v) < 0) out.push(v);
  }
  return shuf(out);
}
function mkNum(q, r, step, min, expl){
  const o = numOpts(r, step, min);
  return mk(q, o, o.indexOf(r), expl);
}
function mkList(q, list, correct, expl){
  const o = shuf(list);
  return mk(q, o, o.indexOf(correct), expl);
}
function comparerOpts(a, b){
  const hi = Math.max(a, b), lo = Math.min(a, b);
  const out = [hi, lo];
  let guard = 0;
  while (out.length < 4 && guard < 80){
    const c = rand(Math.max(hi, 20)) + 1;
    if (out.indexOf(c) < 0) out.push(c);
    guard++;
  }
  return shuf(out);
}
function conjQ(verb, forms, tenseLabel){
  const idx = rand(6);
  const pro = ['Je','Tu','Il','Nous','Vous','Ils'][idx];
  const correct = forms[idx];
  const others = [];
  forms.forEach((f, j) => { if (j !== idx && f !== correct && others.indexOf(f) < 0) others.push(f); });
  const opts = shuf([correct].concat(shuf(others).slice(0, 3)));
  const el = /^[aeiouéèêh]/i.test(correct) ? "J'" : 'Je ';
  const head = pro === 'Je' ? el : pro + ' ';
  return mk(head + '... ' + tenseLabel + ' (' + verb + ')', opts, opts.indexOf(correct), head + correct + '.');
}

    'dire': { present: ['dis','dis','dit','disons','dites','disent'] },
    'venir': { present: ['viens','viens','vient','venons','venez','viennent'] },

  }
  const mode = pick(['present', 'present', 'imparfait', 'futur', 'irregulier', 'irregulier']);

// ---------- état du jeu ----------
let q = null;
let qIndex = 0;
let bon = 0, total = 0;
let playing = false;
let lastWasOK = false;
let themeOrder = [];
let themePos = 0;
let nextQuestionTimer = null;
const TURN_LEN = 5;
let recentQs = [];

function genThemeOrder(){
  themeOrder = THEMES.slice();
  for (let i = themeOrder.length - 1; i > 0; i--){ const j = rand(i + 1); [themeOrder[i], themeOrder[j]] = [themeOrder[j], themeOrder[i]]; }
  themePos = 0;
}
function nextTheme(){ themePos = (themePos + 1) % themeOrder.length; return themeOrder[themePos] || THEMES[0]; }

function buildQuestion(){
  const gen = G[theme] || G.nombres;
  let tries = 0;
  do { q = gen(niveau); tries++; } while (q && q.q && recentQs.indexOf(q.q) >= 0 && tries < 8);
  if (!q || !q.q) q = mk("Combien font 2 + 2 ?", ["4", "3", "5", "6"], 0, "2 + 2 = 4.");
  recentQs.push(q.q);
  if (recentQs.length > 14) recentQs.shift();
  q.theme = theme;
  q.n = TURN_LEN;
  qIndex = 0;
  lastWasOK = false;
}

function showQuestion(){
  if (!q) buildQuestion();
  show(".question"); show(".repcount"); show(".score");
  hide(".results");
  setText(".question", q.q);
  const opts = q.opts || ["A","B","C","D"];
  const buttons = document.querySelectorAll(".qbtn");
  buttons.forEach((b, i) => {
    if (i < opts.length){ b.style.display = ""; b.textContent = opts[i]; b.style.pointerEvents = ""; b.className = "qbtn"; }
    else b.style.display = "none";
  });
  hide(".result");
  hide(".btn-next");
  setText(".repcount", total + " / " + q.n);
  setTimeout(() => maybeAutoSpeak(currentChar), 350);
}

function handleAnswer(i){
  if (!q || playing === false) return;
  const btns = document.querySelectorAll(".qbtn");
  btns.forEach(b => b.style.pointerEvents = "none");
  const correct = (i === q.ans);
  q.c = i;
  if (correct){ bon++; sfxOK(); } else { sfxNo(); }
  total++;
  q.b = bon; q.r = i; q.a = q.opts[i];
  lastWasOK = correct;
  const res = document.querySelector(".result");
  res.style.display = "";
  res.textContent = correct ? "Bravo !" : "Presque !";
  document.querySelector(".expl").textContent = q.expl || "";
  show(".btn-next");
  const nbA = document.querySelector(".btn-next");
  if (nbA){ nbA.textContent = "Suivant"; nbA.onclick = nextQuestion; }
  setText(".repcount", total + " / " + q.n);
  document.querySelectorAll(".score").forEach(e => e.textContent = bon + " / " + total);
  saveProgress();
}

function nextQuestion(){
  hide(".result");
  hide(".btn-next");
  if (NonStop){ buildQuestion(); showQuestion(); }
  else if (total >= (q.n || TURN_LEN)){ endTurn(true); }
  else { buildQuestion(); showQuestion(); }
}

function endTurn(completed){
  playing = false;
  if (nextQuestionTimer) clearTimeout(nextQuestionTimer);
  const res = document.querySelector(".result");
  res.style.display = "";
  res.textContent = completed ? "Tour terminé !" : "Arrêt.";
  document.querySelector(".expl").textContent = "Bon : " + bon + " / " + total + ".";
  setText(".repcount", bon + " / " + total);
  show(".btn-next");
  const nt = document.querySelector(".btn-next");
  if (nt){ nt.textContent = "Suivant"; nt.onclick = () => { if (duoMode){ duoTurn = 1 - duoTurn; updateDuoScores(); } changeThemeOrLevel(); }; }
  sfxLevel();
  if (!duoMode && completed){ showResults(); return; }
}

function changeThemeOrLevel(){
  hide(".result"); hide(".btn-next"); hide(".score"); hide(".repcount"); hide(".question");
  document.querySelectorAll(".qbtn").forEach(b => b.style.display = "none");
  genThemeOrder();
  theme = nextTheme();
  recentQs = [];
  bon = 0; total = 0;
  buildQuestion();
  showQuestion();
  playing = true;
  updateHUD();
}

function updateHUD(){
  setText(".niveau-label", niveau);
  setText(".theme-label", theme);
  try { sessionStorage.setItem("banq_hud", JSON.stringify({niveau, theme, bon, total, t: Date.now()})); } catch (e) {}
}

function saveProgress(){
  const key = "banq_" + niveau + "_" + theme;
  const prev = saveObj[key] || 0;
  saveObj[key] = Math.max(prev, bon);
  save();
}

function loadProgress(){
  const keys = Object.keys(saveObj).filter(k => k.indexOf("banq_") === 0);
  if (keys.length){
    const parts = pick(keys).split("_");
    const t2 = parts[2];
    theme = THEMES.indexOf(t2) >= 0 ? t2 : THEMES[0];
  } else theme = THEMES[0];
}

// ---------- résultats ----------
function showResults(){
  playing = false;
  hide('.question'); hide('.qbtn'); hide('.repcount');
  const res = document.querySelector('.result');
  hide('.result');
  const r = document.querySelector('.results');
  r.style.display = '';
  show('.stars'); show('.final-bon'); show('.final-theme'); show('.final-niveau'); show('.meme');
  const stars = document.querySelector('.stars');
  const ratio = total > 0 ? bon / total : 0;
  let s = '⭐';
  if (ratio >= 0.9) s = '⭐⭐⭐';
  else if (ratio >= 0.7) s = '⭐⭐';
  else if (ratio >= 0.4) s = '⭐';
  stars.textContent = s;
  setText('.final-bon', bon + (bon > 1 ? ' bonnes' : ' bonne') + ' / ' + total + (total > 1 ? ' questions' : ' question'));
  setText('.final-theme', theme);
  setText('.final-niveau', niveau);
  const memes = document.querySelectorAll('.meme img');
  memes.forEach((img, i) => { img.style.opacity = i < Math.ceil(ratio * memes.length) ? '1' : '0.2'; });
  show('.btn-next');
  const nt = document.querySelector('.btn-next');
  if (nt){ nt.textContent = 'Revenir au menu'; nt.onclick = backToMenu; }
  sfxLevel();
}

// ---------- bruit / tts du personnage actif ----------
let lastSpeakAt = 0;
function speakQuestion(voice){
  const now = Date.now();
  if (now - lastSpeakAt < 2500) return;
  lastSpeakAt = now;
  if (!q) return;
  const txt = q.q.replace(/<[^>]*>/g, '').trim();
  if (!txt) return;
  speak(txt, voice === 'nightsquirrel' ? 0.92 : voice === 'monica' ? 1.12 : 1.0, 0.98, voice);
}

// ---------- déclenchement auto TTS ----------
function maybeAutoSpeak(voice){
  if (!q || !playing) return;
  if (total === 0 || (total > 0 && q.n === total && lastWasOK === false && total % 2 === 0)){
    speakQuestion(voice);
  }
}

// ---------- three.js scene ----------
let scene, camera, renderer, controls;
let emilie = null, nightsquirrel = null, monica = null;
let currentChar = 'emilie';
let charGroup = null;
let decorGroup = null;
let tobogganGroup = null;
let wardrobeMeshes = [];
let starField = null;
let slideAnim = 0;
let slidePhase = 0;

function buildScene(){
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1b3a5b);
  scene.fog = new THREE.Fog(0x1b3a5b, 30, 90);

  camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
  camera.position.set(0, 9, 16);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  const canvasContainer = document.getElementById('scene') || document.body;
  canvasContainer.appendChild(renderer.domElement);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.maxPolarAngle = Math.PI / 2.05;
  controls.minDistance = 5;
  controls.maxDistance = 40;
  controls.target.set(0, 1.5, 0);

  buildLights();
  buildSky();
  buildGround();
  buildDecor();
  buildCharacters();
  buildToboggan();
  buildWardrobeUI();
  buildStars();
  window.addEventListener('resize', onResize);
}

function buildLights(){
  const amb = new THREE.AmbientLight(0x6b8cbe, 0.55);
  scene.add(amb);
  const hemi = new THREE.HemisphereLight(0xbfe0ff, 0x102028, 0.7);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff0d0, 1.1);
  sun.position.set(-12, 18, 8);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.camera.left = -25;
  sun.shadow.camera.right = 25;
  sun.shadow.camera.top = 25;
  sun.shadow.camera.bottom = -25;
  sun.shadow.bias = -0.0008;
  scene.add(sun);
  const fill = new THREE.DirectionalLight(0x8fd0ff, 0.35);
  fill.position.set(10, 6, -10);
  scene.add(fill);
  const rim = new THREE.DirectionalLight(0xffb088, 0.35);
  rim.position.set(-8, 4, -12);
  scene.add(rim);
}

function buildSky(){
  const geo = new THREE.SphereGeometry(90, 32, 16);
  const pos = geo.attributes.position;
  const topC = new THREE.Color(0x050a1c);
  const botC = new THREE.Color(0x2b5c8a);
  const tmp = new THREE.Color();
  const cols = [];
  for (let i = 0; i < pos.count; i++){
    const y = pos.getY(i) / 90;
    const k = Math.max(0, Math.min(1, (y + 0.35) / 1.2));
    tmp.copy(botC).lerp(topC, k);
    cols.push(tmp.r, tmp.g, tmp.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  const mat = new THREE.MeshBasicMaterial({ side: THREE.BackSide, vertexColors: true });
  const dome = new THREE.Mesh(geo, mat);
  scene.add(dome);

  starField = new THREE.InstancedMesh(new THREE.SphereGeometry(0.18, 6, 4), new THREE.MeshBasicMaterial({ color: 0xffffff }), 400);
  const dummy = new THREE.Object3D();
  for (let i = 0; i < 400; i++){
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(Math.random() * 0.75 + 0.15);
    const r = 70 + Math.random() * 12;
    dummy.position.set(Math.sin(phi) * Math.cos(theta) * r, Math.cos(phi) * r * 0.5 + 18, Math.sin(phi) * Math.sin(theta) * r);
    dummy.scale.setScalar(0.6 + Math.random() * 1.2);
    dummy.updateMatrix();
    starField.setMatrixAt(i, dummy.matrix);
  }
  starField.instanceMatrix.needsUpdate = true;
  scene.add(starField);
}

function buildGround(){
  const g = new THREE.Color(0x3a6ea5);
  const geo = new THREE.CircleGeometry(60, 64);
  const mat = new THREE.MeshStandardMaterial({ color: 0x3a6ea5, roughness: 0.42, metalness: 0.18, envMapIntensity: 0.6 });
  const ground = new THREE.Mesh(geo, mat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  ground.position.y = -0.05;
  scene.add(ground);

  const grid = new THREE.GridHelper(120, 48, 0x9fd0ff, 0x5a7fa8);
  grid.position.y = 0.02;
  grid.material.transparent = true;
  grid.material.opacity = 0.35;
  scene.add(grid);

  const ring = new THREE.Mesh(
    new THREE.RingGeometry(6, 8.5, 48),
    new THREE.MeshStandardMaterial({ color: 0x8fc6ff, roughness: 0.3, metalness: 0.5, side: THREE.DoubleSide, transparent: true, opacity: 0.5 })
  );
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = 0.03;
  scene.add(ring);
}

function buildDecor(){
  decorGroup = new THREE.Group();
  scene.add(decorGroup);
  const palette = [0x5fd0ff, 0x8fd8ff, 0xbfe8ff, 0xffd07a, 0xff9aa2, 0xa8e6d9, 0xffb347];
  for (let i = 0; i < 48; i++){
    const radius = 8 + Math.random() * 22;
    const angle = Math.random() * Math.PI * 2;
    const x = Math.cos(angle) * radius;
    const z = Math.sin(angle) * radius;
    const h = 0.4 + Math.random() * 1.4;
    const crystal = new THREE.Mesh(
      new THREE.ConeGeometry(0.25 + Math.random() * 0.35, h, 4 + Math.floor(Math.random() * 3)),
      new THREE.MeshStandardMaterial({ color: pick(palette), roughness: 0.2, metalness: 0.55, emissive: new THREE.Color(pick(palette)).multiplyScalar(0.05), transparent: true, opacity: 0.92 })
    );
    crystal.position.set(x, h / 2, z);
    crystal.rotation.y = Math.random() * Math.PI;
    crystal.rotation.x = (Math.random() - 0.5) * 0.4;
    crystal.castShadow = true;
    decorGroup.add(crystal);
  }
  for (let i = 0; i < 18; i++){
    const radius = 7 + Math.random() * 20;
    const angle = Math.random() * Math.PI * 2;
    const x = Math.cos(angle) * radius;
    const z = Math.sin(angle) * radius;
    const bubble = new THREE.Mesh(
      new THREE.SphereGeometry(0.3 + Math.random() * 0.5, 12, 8),
      new THREE.MeshPhysicalMaterial({ color: new THREE.Color(pick(palette)).multiplyScalar(1.2), transparent: true, opacity: 0.35, roughness: 0.05, metalness: 0.0, clearcoat: 0.4, envMapIntensity: 0.8 })
    );
    bubble.position.set(x, 0.2 + Math.random() * 1.2, z);
    decorGroup.add(bubble);
  }
  for (let i = 0; i < 8; i++){
    const radius = 9 + Math.random() * 14;
    const angle = Math.random() * Math.PI * 2;
    const x = Math.cos(angle) * radius;
    const z = Math.sin(angle) * radius;
    const star = new THREE.Mesh(
      new THREE.OctahedronGeometry(0.5 + Math.random() * 0.4),
      new THREE.MeshStandardMaterial({ color: 0xfff2b8, emissive: 0xffd98a, emissiveIntensity: 0.6, roughness: 0.3, metalness: 0.2 })
    );
    star.position.set(x, 0.6 + Math.random() * 0.8, z);
    decorGroup.add(star);
  }
}

  const flagFabric = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 0.2), new THREE.MeshStandardMaterial({ color: 0xff6f8a, side: THREE.DoubleSide, roughness: 0.6 }));
  flagFabric.position.set(0.15, 1.0, 1.6);
  flagFabric.rotation.y = -0.4;
  tobogganGroup.add(flagFabric);
  tobogganGroup.position.set(4.2, 0, 2.5);
  tobogganGroup.rotation.y = -0.3;
}

function buildWardrobeUI(){
  const panel = document.querySelector('.wardrobe');
  if (!panel) return;
  const items = [
    { id: 'emilie', color: '#6ec6ff', label: 'Émilie' },
    { id: 'nightsquirrel', color: '#2a2a35', label: 'Night Squirrel' },
    { id: 'monica', color: '#ff9ec4', label: 'Monica' }
  ];
  panel.innerHTML = '';
  items.forEach(it => {
    const b = document.createElement('button');
    b.className = 'wh-item';
    b.dataset.id = it.id;
    b.style.background = it.color;
    b.textContent = it.label;
    b.onclick = () => { if (currentChar !== it.id){ showCharacter(it.id); sfxClick(); saveObj['char'] = it.id; save(); } if (playing && q) speakQuestion(it.id); };
    panel.appendChild(b);
  });
}

function buildStars(){
  // already in buildSky
}

function onResize(){
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

// ---------- animate ----------
let t0 = performance.now();
function animate(){
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min((now - t0) / 1000, 0.05);
  t0 = now;
  const time = now / 1000;

  if (charGroup){
    charGroup.children.forEach(child => {
      if (child === emilie || child === nightsquirrel || child === monica){
        const bounce = Math.sin(time * 1.6 + (child.userData.id === 'nightsquirrel' ? 0.6 : child.userData.id === 'monica' ? 0.2 : 0)) * 0.04;
        child.position.y = bounce;
        child.rotation.y = Math.sin(time * 0.5 + (child.userData.id === 'nightsquirrel' ? 0.8 : 0)) * 0.08 + (child.userData.id === 'nightsquirrel' ? 0.2 : 0);
        if (child.userData.tail){
          child.userData.tail.rotation.x = 0.6 + Math.sin(time * 2.2 + (child.userData.id === 'nightsquirrel' ? 1.0 : 0)) * 0.15;
        }
        if (child.userData.mouth){
          child.userData.mouth.scale.y = 0.8 + Math.sin(time * 1.3 + (child.userData.id === 'monica' ? 0.7 : 0)) * 0.3;
        }
      }
    });
  }

  if (decorGroup){
    decorGroup.children.forEach((c, i) => {
      c.rotation.y += dt * (0.05 + (i % 3) * 0.02);
    });
  }

  if (tobogganGroup){
    tobogganGroup.children.forEach((c, i) => {
      if (i === 6) c.rotation.z = Math.sin(time * 2.5) * 0.05;
      if (i === 7) c.position.x = 0.15 + Math.sin(time * 2.5) * 0.05;
    });
  }

  if (starField){
    starField.rotation.y += dt * 0.003;
  }

  controls.update();
  renderer.render(scene, camera);
}

function bindUI(){
  document.querySelectorAll('.qbtn').forEach((b, i) => { b.onclick = () => handleAnswer(i); });
  document.querySelectorAll('.niveau-pill').forEach(p => {
    if (p.dataset.niv === niveau) p.classList.add('active'); else p.classList.remove('active');
    p.onclick = () => {
      document.querySelectorAll('.niveau-pill').forEach(x => x.classList.remove('active'));
      p.classList.add('active');
      setNiveau(p.dataset.niv);
      if (playing){ genThemeOrder(); theme = nextTheme(); buildQuestion(); showQuestion(); }
    };
  });
  const mp = document.getElementById('m-play');
  if (mp) mp.onclick = () => { sfxClick(); hide('.results'); startGame(); };
  const mn = document.getElementById('m-nonstop');
  if (mn) mn.onclick = () => { sfxClick(); hide('.results'); startNonStop(); };
  const md = document.getElementById('m-duo');
  if (md) md.onclick = () => { sfxClick(); hide('.results'); duoStart(); };
  const nb = document.querySelector('.btn-next');
  if (nb) nb.onclick = nextQuestion;
  buildWardrobeUI();
}

function init(){
  buildScene();
  loadProgress();
  if (!saveObj['niveau']) saveObj['niveau'] = 'CE2';
  niveau = saveObj['niveau'] || 'CE2';
  const savedChar = saveObj['char'] || 'emilie';
  currentChar = savedChar;
  updateHUD();
  animate();
  buildWardrobeUI();
  if (typeof showCharacter === 'function') showCharacter(savedChar);
  bindUI();
  setTimeout(() => { speak('Bienvenue sur la banquise en folie. Choisis un personnage.', 1.0, 0.98, 'emilie'); }, 400);
}

init();
</script>
